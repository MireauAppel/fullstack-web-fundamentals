<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{{ acc['name'] }} - Lupec</title>
</head>
<body>
    <h1>{{ acc['name'] }}</h1>
    <p>{{ acc['description'] }}</p>
    <p><strong>Prix :</strong> {{ acc['price'] }}€/nuit | <strong>Capacité :</strong> {{ acc['capacity'] }} personnes</p>

    <div style="background-color: #f9f9f9; padding: 15px; margin-top: 20px; border: 1px solid #ccc;">
        {% if session.user_id %}
            <h3>Faire une demande de réservation</h3>
            <form method="POST" action="/book">
                <input type="hidden" name="accommodation_id" value="{{ acc['id'] }}">
                
                <label>Date d'arrivée :</label>
                <input type="date" id="start_date" name="start_date" required>
                
                <label>Date de départ :</label>
                <input type="date" id="end_date" name="end_date" required>
                
                <button type="submit">Confirmer la demande</button>
            </form>
        {% else %}
            <p><a href="/login">Connectez-vous</a> pour pouvoir réserver ce logement.</p>
        {% endif %}
    </div>

    <br>
    <a href="/">Retour à l'accueil</a>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const startInput = document.getElementById('start_date');
            const endInput = document.getElementById('end_date');

            if (startInput && endInput) {
                // 1. Bloquer les dates dans le passé
                // On récupère la date d'aujourd'hui au format AAAA-MM-JJ
                const today = new Date().toISOString().split('T')[0];
                startInput.setAttribute('min', today);
                endInput.setAttribute('min', today);

                // 2. Écouter quand l'utilisateur change la date d'arrivée
                startInput.addEventListener('change', function() {
                    // La date de départ minimum devient la date d'arrivée !
                    endInput.setAttribute('min', this.value);
                    
                    // Si le client avait déjà choisi une date de départ qui est 
                    // maintenant avant la nouvelle date d'arrivée, on vide le champ
                    if (endInput.value < this.value) {
                        endInput.value = "";
                    }
                });
            }
        });
    </script>
</body>
</html>
