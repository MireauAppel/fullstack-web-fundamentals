        async function getStationId(cityName) {
            const url = `https://api.allorigins.win/raw?url=https://public-api.meteofrance.fr/public/DPObs/v1/liste-stations?apikey=${API_KEY}`;
            const response = await fetch(url);
            const csvText = await response.text();
            
            console.log("Réponse brute de api: ", csvText);

            const lines = csvText.split('\n');
            for (let line of lines) {
                if (line.includes(cityName)) {
                    return line.split(';')[0]; 
                }
            }
            throw new Error("Station introuvable");
        }

        
        async function getWeather(stationId) {
            const url = `https://api.allorigins.win/raw?url=https://public-api.meteofrance.fr/public/DPObs/v1/observation?id_station=${stationId}&apikey=${API_KEY}`;
            return await response.json();
        }

       
        document.getElementById('weatherForm').addEventListener('submit', async function(event) {
            event.preventDefault();
            const city = document.getElementById('cityInput').value.toUpperCase();
            const resultDiv = document.getElementById('result');
            
            resultDiv.innerHTML = "<p>Chargement...</p>";

            try {
                const stationId = await getStationId(city);
                const data = await getWeather(stationId);

                resultDiv.innerHTML = `
                    <h2>Météo à ${city}</h2>
                    <p>Vitesse du vent : ${data.vent_vitesse} m/s</p>
                    <p>Température : ${data.temperature} degrés Celsius</p>
                    <p>Pluie dans la dernière heure : ${data.precipitations} mm</p>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">Erreur : ${error.message}</p>`;
            }
        });
