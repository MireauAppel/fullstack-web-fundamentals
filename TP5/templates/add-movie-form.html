<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Ajouter un film</title>
</head>
<body>
    <h1> Ajouter un film </h1>
    <form action="/add-movie" method="get">
        Titre : <input type="text" name="title"><br>
        Année : <input type="text" name="year"><br>
        Acteurs : <input type="text" name="actors"><br>
        Résumé : <input type="text" name="plot"><br>
        Affiche (URL) : <input type="text" name="poster"><br>
        <br>
        <input type="submit" value="Ajouter">
    </form>
    <br>
    <form action="/">
        <input type="submit" value="Annuler">
    </form>
</body>
</html>
