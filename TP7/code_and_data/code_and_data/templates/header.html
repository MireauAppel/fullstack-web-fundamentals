<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Cuisine Facile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Cuisine Facile</a>
            <div class="d-flex">
                <form class="d-flex me-3" action="/search" method="get">
                    <input class="form-control me-2" type="search" name="query" placeholder="Rechercher...">
                    <button class="btn btn-outline-light" type="submit">Recherche</button>
                </form>
                {% if 'user_id' in session %}
                    <span class="navbar-text me-3">Connecté en tant que {{ session['name'] }}</span>
                    <form action="/logout" method="post" class="d-inline">
                        <button class="btn btn-danger" type="submit">Se déconnecter</button>
                    </form>
                {% else %}
                    <a href="/login" class="btn btn-primary me-2">Se connecter</a>
                    <a href="/new_user" class="btn btn-secondary">Nouvel utilisateur</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container">
